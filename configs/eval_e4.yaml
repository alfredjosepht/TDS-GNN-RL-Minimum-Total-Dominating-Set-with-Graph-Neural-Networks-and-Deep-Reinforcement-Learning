# E4: real / benchmark graphs placed by the user in data/benchmarks/ (see scripts/run_e4.py).
name: e4
sets: ["data/benchmarks_npz/*.npz"]
out: results/e4/raw.csv
methods:
  - {type: greedy}
  - {type: greedy_rr}
  - {type: greedy_rr_ls, ls_time: 1.0}
  - {type: ilp, time_limit: 600, threads: 8}
  - {type: rl, label: ours, checkpoints: ["checkpoints/default_seed0/best.pt", "checkpoints/default_seed1/best.pt", "checkpoints/default_seed2/best.pt", "checkpoints/default_seed3/best.pt", "checkpoints/default_seed4/best.pt"], ls_time: 1.0, multi_select: auto}
